<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひらがな学習 - ようおん・そくおん</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --primary-color: #4682b4;
            --accent-color: #ff6347;
            --hint-color: #3cb371;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            overflow-x: hidden;
        }

        #app {
            text-align: center;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .settings-area {
            width: 100%;
            background: #f9f9f9;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }

        .settings-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .group-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .group-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .control-btns {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .mini-btn {
            font-size: 0.7rem;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
        }

        .hiragana-display {
            width: fit-content;
            min-width: 160px;
            max-width: 100%;
            min-height: 120px;
            padding: 20px 28px;
            border: 6px solid var(--primary-color);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            background-color: #fffacd;
        }

        #hiragana-char {
            font-size: 110px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
            white-space: nowrap;
        }

        .info-area {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }

        #hint-button {
            padding: 10px 28px;
            font-size: 1.1rem;
            background-color: var(--hint-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2a7a50;
        }

        #hint-button:active { transform: translateY(3px); box-shadow: none; }

        #hint-content {
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 130px;
        }

        #hint-content.visible {
            opacity: 1;
        }

        .emoji-large {
            display: block;
            font-size: 4.5rem;
            margin-bottom: 0.5rem;
        }

        #hint-word {
            font-size: 1.8rem;
            color: var(--hint-color);
            font-weight: bold;
        }

        #hint-image {
            max-width: 130px;
            max-height: 130px;
            border-radius: 12px;
            margin-top: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .feedback-area {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .feedback-btn {
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feedback-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn-good { background-color: #e3f2fd; color: #1976d2; border: 2px solid #1976d2; }
        .btn-bad  { background-color: #fff3e0; color: #f57c00; border: 2px solid #f57c00; }

        #next-button {
            margin-top: 1rem;
            padding: 12px 24px;
            font-size: 1.1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d44e38;
        }


        #error-msg {
            color: red;
            font-size: 0.8rem;
            display: none;
        }

        /* スマホ横向き：2カラムレイアウト */
        @media (orientation: landscape) and (max-height: 500px) {
            #app {
                display: grid;
                grid-template-columns: auto 1fr;
                grid-template-areas:
                    "settings settings"
                    "error    error"
                    "char     info"
                    "next     next";
                padding: 0.5rem 0.8rem;
                column-gap: 1rem;
                row-gap: 0.25rem;
                max-height: 100svh;
                box-sizing: border-box;
                overflow: hidden;
            }
            .settings-area  { grid-area: settings; margin-bottom: 0; padding: 4px 8px; }
            .settings-title { font-size: 0.7rem; margin-bottom: 2px; }
            .group-selector { gap: 3px; grid-template-columns: repeat(4, 1fr); }
            .control-btns   { margin-top: 3px; }
            #error-msg          { grid-area: error; }
            .hiragana-display   { grid-area: char; min-height: 70px; padding: 10px 14px; margin-bottom: 0; align-self: center; }
            .info-area          { grid-area: info; min-height: unset; justify-content: center; gap: 0.2rem; }
            #hint-button        { font-size: 0.85rem; padding: 6px 16px; }
            #hint-content       { min-height: unset; }
            .emoji-large        { font-size: 2.5rem; margin-bottom: 0.2rem; }
            #hint-image         { max-width: 65px; max-height: 65px; }
            #hint-word          { font-size: 1.1rem; }
            .feedback-area      { gap: 10px; margin-top: 0; }
            .feedback-btn       { width: 48px; height: 48px; font-size: 1.2rem; }
            #next-button        { grid-area: next; margin-top: 0; padding: 6px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="settings-area">
            <div class="settings-title">練習する「よみかた」をえらぼう</div>
            <div class="group-selector" id="group-selector"></div>
            <div class="control-btns">
                <button class="mini-btn" onclick="selectAll(true)">ぜんぶ</button>
                <button class="mini-btn" onclick="selectAll(false)">リセット</button>
            </div>
        </div>

        <div id="error-msg">練習するものを1つ以上選んでね！</div>

        <div class="hiragana-display">
            <p id="hiragana-char">...</p>
        </div>

        <div class="info-area">
            <button id="hint-button" onclick="showHint()">ヒントを見る</button>

            <div id="hint-content">
                <div id="hint-media"></div>
                <div id="hint-word"></div>
            </div>

            <div class="feedback-area">
                <button class="feedback-btn btn-good" onclick="handleFeedback(-1)" title="わかった！">👍</button>
                <button class="feedback-btn btn-bad"  onclick="handleFeedback(2)"  title="むずかしい">🤔</button>
            </div>
        </div>

        <button id="next-button" onclick="startNewRound()">つぎへ</button>
    </div>

    <script>
        const yoonData = [
            // ゃ
            { char: 'きゃ', word: 'きゃんぷ',       emoji: '⛺', group: 'ゃ' },
            { char: 'しゃ', word: 'しゃしん',       emoji: '📷', group: 'ゃ' },
            { char: 'ちゃ', word: 'おちゃ',         emoji: '🍵', group: 'ゃ' },
            { char: 'にゃ', word: 'にゃんこ',       emoji: '🐱', group: 'ゃ' },
            { char: 'ひゃ', word: 'ひゃく',         emoji: '💯', group: 'ゃ' },
            { char: 'りゃ', word: '（りゃ）',       emoji: '🌀', group: 'ゃ' },
            { char: 'じゃ', word: 'じゃがいも',     emoji: '🥔', group: 'ゃ' },
            { char: 'きゃ', word: 'きゃべつ',       emoji: '🥬', imageUrl: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgrxDFaC8qrO9NvUwdkgK2wpHraFDgLufEwGjeUkeQTgh05OyzOxWnI2jOsZA2YOE_gSPK9KGjPYes4_ZWdurDbDRsWjj5rgJoYyj2F-qrJ4BU19z988v38ITqD9zskMTh1AnzvrN6fbzv3/s400/vegetable_cabbage2.png', group: 'ゃ' },
            { char: 'にゃ', word: 'こんにゃく',     emoji: '🍢', imageUrl: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjXUYVxrthr4rIDTg77dn5pCoi1G2aTic_2C_30HfuKPhXnEtrbkkGsmFdJAecFZAcnxoj4hOU62SNbRNKSq5ZJUuPMPMZHH_Rv6-p3ffelb6fJIWQrGToZOF8etzapaY1qwxZlNolL-jIz/s400/food_konnyaku.png', group: 'ゃ' },
            // ゅ
            { char: 'きゅ', word: 'きゅうり',       emoji: '🥒', group: 'ゅ' },
            { char: 'しゅ', word: 'しゅりけん',     emoji: '⭐', imageUrl: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEheMs6_3PO43F_xrWascJmxdEfF9Ii5VnCA9Gc-LQbOLPR_Qq2OIzghyphenhyphenwQwoGvHGQPwiEc1dLkX-OI_vwEcyKiRBxsS8Wq-r-waXeK5MY2RS73LiFVnNIzxnxCvlUdGA1gwGJFi3xEq8MN0/s400/ninja_syuriken1.png', group: 'ゅ' },
            { char: 'ちゅ', word: 'ちゅうりっぷ',   emoji: '🌷', group: 'ゅ' },
            { char: 'にゅ', word: 'にゅうがく',     emoji: '🏫', group: 'ゅ' },
            { char: 'りゅ', word: 'りゅう',         emoji: '🐉', group: 'ゅ' },
            { char: 'ぎゅ', word: 'ぎゅうにゅう',   emoji: '🥛', group: 'ゅ' },
            { char: 'じゅ', word: 'じゅうす',       emoji: '🧃', group: 'ゅ' },
            { char: 'きゅ', word: 'きゅうしょく',   emoji: '🍱', imageUrl: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhi9ils7wItTEPJbaXolPLQqnn8mq2p3xeENLARR3WszexByhQEHrQ0lrIXUg_LUhTaV3uUAG54kFZC3q4ICl7AA57SFHHrJEJYo98DWsqoMVq9TjV2iiD6AG7WQjro9p4hT1pVwVW5T5jT/s400/kyusyoku_tray.png', group: 'ゅ' },
            // ょ
            { char: 'きょ', word: 'きょうりゅう',   emoji: '🦕', group: 'ょ' },
            { char: 'しょ', word: 'しょうぼうしゃ', emoji: '🚒', group: 'ょ' },
            { char: 'ちょ', word: 'ちょうちょ',     emoji: '🦋', group: 'ょ' },
            { char: 'にょ', word: '（にょ）',       emoji: '🌀', group: 'ょ' },
            { char: 'ひょ', word: 'ひょう',         emoji: '🐆', group: 'ょ' },
            { char: 'りょ', word: 'りょこう',       emoji: '✈️', group: 'ょ' },
            { char: 'ぎょ', word: 'ぎょうざ',       emoji: '🥟', group: 'ょ' },
            { char: 'じょ', word: 'じょうろ',       emoji: '🪣', group: 'ょ' },
            { char: 'ちょ', word: 'ちょこ',         emoji: '🍫', group: 'ょ' },
            // っ（促音）
            { char: 'きって',   word: 'きって',     emoji: '📮', group: 'っ' },
            { char: 'らっこ',   word: 'らっこ',     emoji: '🦦', imageUrl: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhmCcrINrs3NFV3V5iCnbuEuy0Ovofk6obhfecsF3ra9432OYEm8Ye-SxgCbJDMGZFTm9T4LnvAsRK6T-BczaJ-aEOA7KI4_f3t8wGnOlsx_fOFG-xVdgld1dGCrajUfDNYaSWJitJKmzE/s400/rakko.png', group: 'っ' },
            { char: 'きっぷ',   word: 'きっぷ',     emoji: '🎫', group: 'っ' },
            { char: 'はっぱ',   word: 'はっぱ',     emoji: '🍃', imageUrl: 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhZ6_iE5pyMuQaq8b04wQfPBt9QE8TH9XU5i6KCibKSJeC6dHT45Q6dtQI3ATm6yu9oYg2fbIe-FynNQsUXzaQCodxDV1Ep0iWMQ2jcX_13Rj8VibmsYDSuYxryFSZnj3pk-E3uxRn_FxfQ/s400/plant_buna_leaf.png', group: 'っ' },
            { char: 'くっきー', word: 'くっきー',   emoji: '🍪', group: 'っ' },
        ];

        const groups = ['ゃ', 'ゅ', 'ょ', 'っ'];
        const groupMapping = { ya: 'ゃ', yu: 'ゅ', yo: 'ょ', q: 'っ' };

        const masteryWeights = {};
        yoonData.forEach(d => { masteryWeights[d.char] = 5; });

        const hiraganaCharEl = document.getElementById('hiragana-char');
        const hintContentEl  = document.getElementById('hint-content');
        const hintMediaEl    = document.getElementById('hint-media');
        const hintWordEl     = document.getElementById('hint-word');
        const hintButtonEl   = document.getElementById('hint-button');
        const groupSelectorEl = document.getElementById('group-selector');
        const errorMsgEl     = document.getElementById('error-msg');

        let currentData    = null;
        let selectedGroups = [...groups];

        const landscapeMQ = window.matchMedia('(orientation: landscape) and (max-height: 500px)');

        function charFontSize(text) {
            const landscape = landscapeMQ.matches;
            const len = text.length;
            if (landscape) {
                if (len <= 1) return '60px';
                if (len === 2) return '40px';
                if (len === 3) return '30px';
                if (len === 4) return '24px';
                if (len === 5) return '20px';
                return '17px';
            }
            if (len <= 1) return '110px';
            if (len === 2) return '68px';
            if (len === 3) return '52px';
            if (len === 4) return '44px';
            if (len === 5) return '36px';
            return '30px';
        }

        function parseUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const gParam = urlParams.get('g');
            if (gParam) {
                const keys = gParam.split(',');
                const mapped = keys.map(k => groupMapping[k.trim().toLowerCase()]).filter(v => v);
                if (mapped.length > 0) selectedGroups = mapped;
            }
        }

        function initSelector() {
            groupSelectorEl.innerHTML = groups.map(g => `
                <label class="group-item">
                    <input type="checkbox" value="${g}" ${selectedGroups.includes(g) ? 'checked' : ''} onchange="updateGroups()">
                    ${g.replace('行', '')}
                </label>
            `).join('');
        }

        function updateGroups() {
            const checkboxes = groupSelectorEl.querySelectorAll('input:checked');
            selectedGroups = Array.from(checkboxes).map(cb => cb.value);
            if (selectedGroups.length === 0) {
                errorMsgEl.style.display = 'block';
            } else {
                errorMsgEl.style.display = 'none';
                startNewRound();
            }
        }

        function selectAll(bool) {
            groupSelectorEl.querySelectorAll('input').forEach(cb => cb.checked = bool);
            updateGroups();
        }

        function showHint() {
            if (currentData.imageUrl) {
                hintMediaEl.innerHTML = `<img id="hint-image" src="${currentData.imageUrl}" alt="hint">`;
            } else {
                hintMediaEl.innerHTML = `<span class="emoji-large">${currentData.emoji}</span>`;
            }
            hintContentEl.classList.add('visible');
            hintButtonEl.style.visibility = 'hidden';
        }

        function handleFeedback(adjustment) {
            if (!currentData) return;
            masteryWeights[currentData.char] = Math.max(1, Math.min(15, masteryWeights[currentData.char] + adjustment));

            const el = document.querySelector(adjustment > 0 ? '.btn-bad' : '.btn-good');
            el.style.transform = 'scale(1.2)';
            setTimeout(() => {
                el.style.transform = 'scale(1)';
                startNewRound();
            }, 150);
        }

        function getWeightedRandom(dataList) {
            const totalWeight = dataList.reduce((sum, item) => sum + masteryWeights[item.char], 0);
            let random = Math.random() * totalWeight;
            for (const item of dataList) {
                if (random < masteryWeights[item.char]) return item;
                random -= masteryWeights[item.char];
            }
            return dataList[0];
        }

        function startNewRound() {
            if (selectedGroups.length === 0) return;

            hintContentEl.classList.remove('visible');
            hintMediaEl.innerHTML = '';
            hintWordEl.textContent = '';

            const filteredData = yoonData.filter(d => selectedGroups.includes(d.group));
            currentData = getWeightedRandom(filteredData);

            hiraganaCharEl.textContent = currentData.word;
            hiraganaCharEl.style.fontSize = charFontSize(currentData.word);
            hintButtonEl.style.visibility = 'visible';
        }

        landscapeMQ.addEventListener('change', () => {
            if (currentData) hiraganaCharEl.style.fontSize = charFontSize(currentData.word);
        });

        window.onload = () => {
            parseUrlParams();
            initSelector();
            startNewRound();
        };
    </script>
</body>
</html>
