<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひきざんカード - カウントつき</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --primary-color: #4682b4;
            --accent-color: #ff6347;
            --answer-color: #3cb371;
            --border-color: #e0e0e0;
            --count-color: #ff8c00;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            overflow-x: hidden;
        }

        #app {
            text-align: center;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .col-left, .col-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin: 0 0 0.5rem;
        }

        /* カウント表示 */
        .count-area {
            width: 100%;
            display: flex;
            justify-content: space-around;
            background: #fff7e6;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 0;
            margin-bottom: 1rem;
        }

        .count-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .count-label {
            font-size: 0.8rem;
            color: #666;
        }

        .count-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--count-color);
            line-height: 1.1;
        }

        /* カード本体（問題表示） */
        .flash-card {
            width: 100%;
            min-height: 180px;
            border: 6px solid var(--primary-color);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.8rem;
            background-color: #fffacd;
            user-select: none;
            box-sizing: border-box;
            padding: 1rem;
        }

        #card-text {
            font-size: 5.1rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }

        #card-text.answered {
            color: var(--answer-color);
        }

        /* 3項など長い式は少し小さく */
        #card-text.small {
            font-size: 3.4rem;
        }

        .hint-text {
            font-size: 0.95rem;
            color: #999;
            min-height: 1.3rem;
            margin-bottom: 0.8rem;
        }

        /* 回答選択肢ボタン（0〜10） */
        .answer-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 1rem;
        }

        .answer-btn {
            width: 52px;
            height: 52px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid var(--primary-color);
            background: #fff;
            color: var(--primary-color);
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(70, 130, 180, 0.4);
            padding: 0;
        }

        .answer-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .answer-btn.correct {
            background: var(--answer-color);
            color: #fff;
            border-color: var(--answer-color);
        }

        .answer-btn.wrong {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            animation: shake 0.3s;
        }

        .answer-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            font-size: 1.05rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
        }

        #next-button {
            background-color: var(--accent-color);
            box-shadow: 0 4px 0 #d44e38;
            flex: 1;
            max-width: 200px;
        }

        #reset-button {
            background-color: #90a4ae;
            box-shadow: 0 4px 0 #607d8b;
        }

        #next-button:active, #reset-button:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .home-link {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--primary-color);
        }

        /* ===== スマホ横画面（landscape）最適化 ===== */
        /* 「せいかい かず」を左、問題カード＋回答ボタンを右に並べる */
        @media (orientation: landscape) and (max-height: 600px) {
            html, body { height: 100%; }
            body { align-items: stretch; }

            #app {
                display: grid;
                width: 100%;
                max-width: none;
                height: 100vh;
                box-sizing: border-box;
                border-radius: 0;
                box-shadow: none;
                padding: 10px 18px;
                column-gap: 18px;
                row-gap: 4px;
                align-content: center;
                grid-template-columns: minmax(120px, 0.8fr) 1.8fr;
                grid-template-rows: 1fr auto auto;
                grid-template-areas:
                    "left  right"
                    "nav   right"
                    "home  right";
            }

            #app > .col-left  { grid-area: left; justify-content: center; }
            #app > .col-right { grid-area: right; height: 100%; justify-content: center; }
            #app > .btn-row   { grid-area: nav; align-self: center; flex-wrap: wrap; }
            #app > .home-link { grid-area: home; margin: 0; align-self: center; }

            .col-left h1 { font-size: 1.1rem; }
            .count-area { margin: 0; padding: 6px 0; }
            .count-label { font-size: 0.75rem; }
            .count-value { font-size: 1.5rem; }

            .flash-card { min-height: 0; flex: 1; margin-bottom: 0.4rem; }
            #card-text { font-size: 3.6rem; }
            #card-text.small { font-size: 2.5rem; }
            .hint-text { min-height: 1.1rem; margin-bottom: 0.4rem; }
            .answer-btn { width: 44px; height: 44px; font-size: 1.2rem; }
            .answer-buttons { gap: 6px; margin-bottom: 0; }
            .btn-row button { padding: 8px 14px; font-size: 0.9rem; }
            #next-button { max-width: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="col-left">
            <h1>ひきざんカード</h1>
            <div class="count-area">
                <div class="count-box">
                    <span class="count-label">せいかい かず</span>
                    <span class="count-value" id="solved-count">0</span>
                </div>
            </div>
        </div>

        <div class="col-right">
            <div class="flash-card" id="flash-card">
                <p id="card-text">…</p>
            </div>
            <div class="hint-text" id="hint-text">こたえのボタンをおしてね！</div>
            <div class="answer-buttons" id="answer-buttons"></div>
        </div>

        <div class="btn-row">
            <button id="next-button" onclick="nextProblem(event)">つぎの もんだい</button>
            <button id="reset-button" onclick="resetAll(event)">リセット</button>
        </div>

        <a class="home-link" href="index.html">← ホームへ</a>
    </div>

    <script>
        // ------- 出題データ -------
        // 3種類をまぜて出題する：
        //  ・2項（10までのひきざん・くりさがりなし）
        //  ・2項のくりさがり（ひかれる数11〜18・答え1〜9）
        //  ・3項（ひかれる数が10〜19・答えは0以上）
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        function makeProblem() {
            const r = Math.random();
            if (r < 0.34) {
                // 2項・10まで（くりさがりなし）
                const a = randInt(2, 10);
                const b = randInt(1, a);
                return [a, b];
            } else if (r < 0.67) {
                // 2項・くりさがり（ひかれる数11〜18、答え1〜9、一の位でくりさがる）
                let a, b;
                do {
                    a = randInt(11, 18); b = randInt(2, 9);
                } while (a - b < 1 || a - b > 9 || (a % 10) >= b);
                return [a, b];
            } else {
                // 3項・ひかれる数が10〜19、とちゅうも答えも0以上
                let a, b, c;
                do {
                    a = randInt(11, 19); b = randInt(1, 9); c = randInt(1, 9);
                } while (a - b < 0 || a - b - c < 0);
                return [a, b, c];
            }
        }
        function sameTerms(x, y) {
            return x.length === y.length && x.every((v, i) => v === y[i]);
        }
        // ひきざんの答え（最初の項から順にひく）
        function answerOf(terms) {
            return terms.reduce((acc, v, i) => (i === 0 ? v : acc - v));
        }

        // 答えの範囲（回答ボタンの数字）
        const ANSWER_MIN = 0;
        const ANSWER_MAX = 17;

        // ------- 状態 -------
        let current = null;      // { terms: [...] }
        let answered = false;    // 現在の問題に正解済みか
        let advanceTimer = null; // 正解後に次へ進むタイマー
        let solvedCount = 0;     // 正解した回数

        const cardTextEl = document.getElementById('card-text');
        const hintTextEl = document.getElementById('hint-text');
        const solvedCountEl = document.getElementById('solved-count');
        const answerButtonsEl = document.getElementById('answer-buttons');

        // ------- 記録の保存（localStorage・日付ごとに集計）-------
        // 保存形式:
        // { "2026-7-28": { add:{correct,wrong}, sub:{correct,wrong} }, ... }
        const STATS_KEY = 'keisanCardStats';
        const OP = 'sub';   // このページは ひきざん（たしざんは 'add'）

        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
        }
        function loadStats() {
            try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch (e) { return {}; }
        }
        function saveStats(stats) {
            try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
        }
        function todayEntry(stats) {
            const t = todayStr();
            if (!stats[t]) stats[t] = {};
            if (!stats[t].add) stats[t].add = { correct: 0, wrong: 0 };
            if (!stats[t].sub) stats[t].sub = { correct: 0, wrong: 0 };
            return stats[t];
        }
        // 回答を1件記録して、今日の正解数を返す
        function recordAnswer(isCorrect) {
            const stats = loadStats();
            const entry = todayEntry(stats);
            if (isCorrect) entry[OP].correct++;
            else entry[OP].wrong++;
            saveStats(stats);
            return entry[OP].correct;
        }
        function refreshCount() {
            solvedCount = todayEntry(loadStats())[OP].correct;
            solvedCountEl.textContent = solvedCount;
        }

        solvedCount = todayEntry(loadStats())[OP].correct;   // 今日の正解数を復元
        solvedCountEl.textContent = solvedCount;

        // ------- 回答ボタン（0〜17）を作る -------
        function buildAnswerButtons() {
            answerButtonsEl.innerHTML = '';
            for (let n = ANSWER_MIN; n <= ANSWER_MAX; n++) {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = n;
                btn.addEventListener('click', () => checkAnswer(n, btn));
                answerButtonsEl.appendChild(btn);
            }
        }

        function drawNext() {
            let next;
            do { next = makeProblem(); } while (current && sameTerms(next, current.terms));
            current = { terms: next };
        }

        function showProblem() {
            answered = false;
            cardTextEl.classList.remove('answered');
            cardTextEl.classList.toggle('small', current.terms.length >= 3);
            cardTextEl.textContent = current.terms.join(' − ') + ' =';
            hintTextEl.textContent = 'こたえのボタンをおしてね！';
            // ボタンの見た目・有効状態をリセット
            Array.from(answerButtonsEl.children).forEach(b => {
                b.classList.remove('correct', 'wrong');
                b.disabled = false;
            });
        }

        function checkAnswer(n, btn) {
            if (answered) return;   // すでに正解済みなら無視
            const correct = answerOf(current.terms);

            if (n === correct) {
                // 正解 → 答えを表示してカウントアップ
                answered = true;
                cardTextEl.classList.add('answered');
                cardTextEl.textContent = current.terms.join(' − ') + ' = ' + correct;
                hintTextEl.textContent = 'せいかい！🎉';
                btn.classList.add('correct');
                Array.from(answerButtonsEl.children).forEach(b => b.disabled = true);

                // 正解を記録してカウント更新
                solvedCount = recordAnswer(true);
                solvedCountEl.textContent = solvedCount;

                // 少し待ってから次の問題へ
                clearTimeout(advanceTimer);
                advanceTimer = setTimeout(() => {
                    drawNext();
                    showProblem();
                }, 1200);
            } else {
                // 不正解 → 不正解を記録（せいかい かず は増えない）
                recordAnswer(false);
                hintTextEl.textContent = 'ちがうよ、もういちど！';
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 500);
            }
        }

        // 「つぎの もんだい」ボタン（正解しなくても次へ・カウントしない）
        function nextProblem(e) {
            e.stopPropagation();
            clearTimeout(advanceTimer);
            drawNext();
            showProblem();
        }

        // 「リセット」ボタン（問題をシャッフルし直す・せいかい かず は消さない）
        function resetAll(e) {
            e.stopPropagation();
            clearTimeout(advanceTimer);
            drawNext();
            showProblem();
            // せいかい かず は1日の合計なので消さない（日付が変わると自動リセット）
            refreshCount();
        }

        // ------- 初期化 -------
        buildAnswerButtons();
        drawNext();
        showProblem();
    </script>
</body>
</html>
