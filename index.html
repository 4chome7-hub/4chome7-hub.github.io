<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>けいさんカード</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --primary-color: #4682b4;
            --answer-color: #3cb371;
            --accent-color: #ff6347;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
        }

        #app {
            text-align: center;
            background-color: var(--card-bg);
            padding: 2rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin: 0 0 1.5rem;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .menu a {
            display: block;
            padding: 1.2rem;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 16px;
        }

        .menu a.add {
            background-color: var(--answer-color);
            box-shadow: 0 5px 0 #2e8b57;
        }

        .menu a.sub {
            background-color: var(--accent-color);
            box-shadow: 0 5px 0 #d44e38;
        }

        .menu a:active {
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>けいさんカード</h1>
        <div class="menu">
            <a class="add" href="addcards.html">たしざん</a>
            <a class="sub" href="subcards.html">ひきざん</a>
        </div>
    </div>
</body>
</html>
