<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法のひらがな</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f0f8ff;
            margin: 0;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        h1 {
            color: #4682b4;
            font-size: clamp(1.4rem, 6vw, 2rem);
            margin: 0 0 16px;
        }
        .character {
            font-size: clamp(80px, 28vw, 140px);
            width: clamp(130px, 38vw, 200px);
            height: clamp(130px, 38vw, 200px);
            line-height: clamp(130px, 38vw, 200px);
            border: 4px solid #4682b4;
            border-radius: 20px;
            display: block;
            margin: 0 auto 24px;
            background: #fffacd;
        }
        .button-area {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 24px;
        }
        .variant-btn {
            flex: 1;
            font-size: clamp(15px, 4vw, 20px);
            padding: 0 8px;
            height: 52px;
            cursor: pointer;
            border-radius: 10px;
            border: 2px solid #aaa;
            background: #fff;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .variant-btn.active { background: #4682b4; color: white; border-color: #4682b4; }
        .variant-btn:disabled { opacity: 0.3; cursor: default; }
        .next-btn {
            font-size: clamp(18px, 5vw, 22px);
            padding: 0;
            height: 56px;
            width: min(80%, 280px);
            background: #ff6347;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c43e2a;
            -webkit-tap-highlight-color: transparent;
        }
        .next-btn:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>
    <h1>魔法のひらがな</h1>
    <div id="display" class="character"></div>
    <div class="button-area">
        <button class="variant-btn" id="btn-base"       onclick="changeChar('base')">そのまま</button>
        <button class="variant-btn" id="btn-dakuten"    onclick="changeChar('dakuten')">゛てんてん</button>
        <button class="variant-btn" id="btn-handakuten" onclick="changeChar('handakuten')">゜まる</button>
    </div>
    <div>
        <button class="next-btn" onclick="nextRandom()">つぎへ ▶</button>
    </div>

    <script>
        const map = {
            'か': { dakuten: 'が', handakuten: null },
            'き': { dakuten: 'ぎ', handakuten: null },
            'く': { dakuten: 'ぐ', handakuten: null },
            'け': { dakuten: 'げ', handakuten: null },
            'こ': { dakuten: 'ご', handakuten: null },
            'さ': { dakuten: 'ざ', handakuten: null },
            'し': { dakuten: 'じ', handakuten: null },
            'す': { dakuten: 'ず', handakuten: null },
            'せ': { dakuten: 'ぜ', handakuten: null },
            'そ': { dakuten: 'ぞ', handakuten: null },
            'た': { dakuten: 'だ', handakuten: null },
            'ち': { dakuten: 'ぢ', handakuten: null },
            'つ': { dakuten: 'づ', handakuten: null },
            'て': { dakuten: 'で', handakuten: null },
            'と': { dakuten: 'ど', handakuten: null },
            'は': { dakuten: 'ば', handakuten: 'ぱ' },
            'ひ': { dakuten: 'び', handakuten: 'ぴ' },
            'ふ': { dakuten: 'ぶ', handakuten: 'ぷ' },
            'へ': { dakuten: 'べ', handakuten: 'ぺ' },
            'ほ': { dakuten: 'ぼ', handakuten: 'ぽ' },
        };

        const baseChars = Object.keys(map);
        let currentBase = 'か';
        let currentType = 'base';

        // 全バリアント（base + dakuten + handakuten）のリストを構築
        const allVariants = [];
        baseChars.forEach(base => {
            allVariants.push({ base, type: 'base' });
            allVariants.push({ base, type: 'dakuten' });
            if (map[base].handakuten) allVariants.push({ base, type: 'handakuten' });
        });

        function nextRandom() {
            const picked = allVariants[Math.floor(Math.random() * allVariants.length)];
            currentBase = picked.base;
            changeChar(picked.type);
        }

        function changeChar(type) {
            currentType = type;
            const display = document.getElementById('display');
            const entry = map[currentBase];

            if (type === 'base')         display.innerText = currentBase;
            else if (type === 'dakuten') display.innerText = entry.dakuten;
            else if (type === 'handakuten') display.innerText = entry.handakuten;

            document.getElementById('btn-base').classList.toggle('active', type === 'base');
            document.getElementById('btn-dakuten').classList.toggle('active', type === 'dakuten');
            document.getElementById('btn-handakuten').classList.toggle('active', type === 'handakuten');
            document.getElementById('btn-handakuten').disabled = !entry.handakuten;

            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance(display.innerText));
        }

        window.onload = () => nextRandom();
    </script>
</body>
</html>
